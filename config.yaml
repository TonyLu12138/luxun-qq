# ============================================================================
# luxun-qq 配置
#
# 敏感项建议用环境变量覆盖，不要写进本文件：
#   LUXUN_LLM_API_KEY    推理后端 API Key
#   LUXUN_SENDER_TOKEN   NapCat access_token
#   LUXUN_DB_KEY         QQ 数据库密钥（仅在解密聊天记录时需要）
# ============================================================================

# ---------------------------------------------------------------------------
# 身份与回答角色
#
#   me / self_id : 现在实际在用的号（1234567890），也就是「说话的人」
#   bot.target_peer : 要自动回复的对象（1987654321）
#
# persona 可选值（见 personas.py）：
#   emotion_master_male  情感大师 · 男方视角（默认）——替你从男方立场回消息
#   luxun                鲁迅式锐评腔
# ---------------------------------------------------------------------------
me: "1234567890"
persona: "emotion_master_male"

# 命令行 plan/chat 的目标对象；留空则每次用 --peer 指定。
# 自动回复服务请用下面的 bot.target_peer。
peer: ""

# ---------------------------------------------------------------------------
# 推理后端：决定"用哪个大模型来想三步 + 写三个候选"
#
#   local_llama    本机 llama.cpp CUDA 服务（LM Studio 自带后端，7B Q4_K_M）
#                  用 tools/model_server.py start 启动，走 18080 端口
#   echo           完全离线，返回预设的中文示例回复。用于跑通链路 / 无网络。
#   local_ollama   本机 Ollama（端口 11434）
#   openai_compat  远程 OpenAI 兼容接口：DeepSeek / 智谱 / Groq / OpenRouter 等
# ---------------------------------------------------------------------------
llm:
  backend: openai_compat          # 本地 llama.cpp 服务也是 OpenAI 兼容接口

  model: "qwen2.5-7b-instruct"
  base_url: "http://127.0.0.1:18080"
  api_key: "local"               # 本地服务不校验，但字段不能为空

  temperature: 0.9
  top_p: 0.9
  max_tokens: 900

  # 两段式生成：先让模型自由写三条候选（语气优先），
  # 再单独一次调用把它结构化（格式优先）。
  # 实测 7B 模型一次调用同时填三步思考 JSON + 写候选时，语气会塌成客服腔；
  # 拆开后质量明显更好。关掉则退回单次调用。
  two_stage: true
  # 语气阶段尝试次数。7B 模型在 0.9 温度下方差大，多试几次取最好的一条，
  # 比反复调 prompt 更可靠。1 = 不重试（更快但更不稳定）。
  voice_attempts: 3

# ---------------------------------------------------------------------------
# 风格参考（可选）。让回复更像"我本人"而不是通用助手腔。
# ---------------------------------------------------------------------------
retrieve:
  enabled: true
  # 手工整理的"我平时怎么说话"（推荐，零依赖）
  style_sample: "data/my_style_sample.txt"
  # 若之后成功导出了聊天记录，可构建检索索引获得更强风格迁移
  index_path: "data/corpus/style_index.jsonl"
  stats_path: "data/corpus/style_stats.json"
  top_k: 6
  min_score: 0.05

# ---------------------------------------------------------------------------
# 发送层（可插拔）
#
#   dry_run    默认。不真发，只打印并写入 data/outbox/，零风险。
#   napcat     通过 NapCat / LLOneBot 的 OneBot 11 HTTP 接口真实发送。
#   webhook    把消息 POST 到你的中转服务。
#   clipboard  复制到剪贴板，你自己粘贴发送。
# ---------------------------------------------------------------------------
sender:
  adapter: napcat                     # 已接入 NapCat，真实发送
  base_url: "http://127.0.0.1:3000"    # NapCat 的 HTTP 服务器端口
  access_token: ""                     # 与 NapCat 配置保持一致；建议用环境变量 LUXUN_SENDER_TOKEN
  self_id: "1234567890"                # 登录 NapCat 的号（发送方）
  timeout: 20

# 本地服务（预留）
server:
  host: "127.0.0.1"
  port: 8848

# ---------------------------------------------------------------------------
# 自动回复服务（NapCat / OneBot 11）
#
# 本机部署形态：
#   NapCat 用 1234567890 登录  →  监听 1987654321 发来的消息
#   → 生成三步思考 + 三候选  →  把候选发给 owner(1234567890) 让你选
#   → 你回 1/2/3  →  由 1234567890 发给 1987654321
# ---------------------------------------------------------------------------
bot:
  host: "127.0.0.1"
  port: 8848
  access_token: ""            # 与 NapCat 上报配置保持一致；留空则不校验

  # ---- 回复范围 ----
  # 模式：
  #   "whitelist"  只回复白名单里的号（推荐，名单见下面 whitelist_file）
  #   "all"        任何人的私聊都回复
  target_mode: "whitelist"

  # 额外的号，支持逗号/空格分隔多个；一般留空，
  # 把号码统一写在白名单文件里更好管理。
  target_peer: ""

  # 白名单文件（相对项目根目录）
  # 一行一个 QQ 号，# 开头是注释。
  # 改完存盘**立即生效**，不用重启服务。
  whitelist_file: "data/whitelist.txt"

  # 审批人：谁能回「1/2/3」触发发送。必须设置，否则任何人都能触发。
  owner: "1234567890"

  # 候选与结果投递到哪：
  #   "self"  = 发给 owner 自己（即 1234567890 给自己发私聊，最方便）
  #   ""      = 不外发，只写服务日志
  #   其他 QQ  = 发给指定号
  owner_sink: "self"

  # WebSocket 模式：NapCat 的 WS 服务器地址
  # 用 `python -m luxun_qq serve-ws` 时生效；需在 NapCat 里启用 websocketServers
  ws_url: "ws://127.0.0.1:3001"

  # ---- 发送延迟：模拟真人打字节奏 ----
  # 每条消息发出前，随机等待 10~30 秒（避免"秒回"显得像机器人）
  send_delay_min: 10
  send_delay_max: 30

  # ---- 自动托管 ----
  # 允许你用 "0"（本次全权交给模型）或 "a"（持续托管）让模型直接回复
  allow_auto_reply: true

  # ---- 退出时清理显存 ----
  # false（默认）：模型服务由它自己的终端窗口负责，关那个窗口就会释放显存
  #               （supervisor 挂了 Job Object，父进程一死 llama-server 跟着死）
  # true         ：关掉本回复服务时，顺手把模型服务也停掉，一并释放显存
  stop_model_on_exit: false

# ---------------------------------------------------------------------------
# 长期记忆
#
# 把全部对话存进 SQLite，并在回复前召回相关内容。分两层：
#   * 消息层——原文全存，按关键词召回"很久以前说过什么"
#   * 事实层——从对话里抽出的长期事实（生日、工作、偏好、约定），每轮都注入
#
# 只看/管理记忆：
#   python -m luxun_qq memory                    总览
#   python -m luxun_qq memory --peer 1987654321  最近对话
#   python -m luxun_qq memory --peer X --facts   已抽出的长期事实
#   python -m luxun_qq memory --peer X --search 面试
#   python -m luxun_qq memory --forget 1987654321   清空某人记忆
# ---------------------------------------------------------------------------
memory:
  enabled: true
  db_path: "data/memory.db"

  # ---- 喂给提示词的内容（精挑细选，不是越多越好）----
  # 短期窗口：库里保留最近多少轮
  recent_limit: 16
  #
  # 但**喂给模型**的历史要少得多。实测：给 10 轮原文时，7B 模型会被
  # 最近聊过的话题锚住——对方换了无关话题，它还是硬把上一轮的事扯出来。
  # 收窄到 4 轮后它转而依赖相关性召回的记忆，表现明显更好。
  prompt_history_limit: 4
  #
  # 按当前消息关键词，召回多少条更早的相关内容
  recall_limit: 6

  # ---- 注入哪些事实 ----
  # 总是注入的"核心"事实条数（对任何话题都成立）
  core_fact_limit: 5
  # 哪些类型算"核心"。偏好也放进来，因为关键词召回抓不到语义关联：
  # 对方说「吃火锅」，字面上跟「不能吃辣」没有共同词，搜不到。
  core_fact_kinds: ["身份", "关系", "偏好"]
  # 按关键词额外召回的事实条数
  relevant_fact_limit: 4

  # ---- 自动抽取事实 ----
  extract_facts: true
  # 每积累多少条对方消息抽一次
  extract_every: 6
  # 抽取用的温度（要稳，不能发挥）
  extract_temperature: 0.2

# 聊天记录数据源（可选，仅在解密本地 QQ 数据库时使用）
# 真实路径建议写在 config.local.yaml 里，不要提交到仓库。
source_db: "H:/path/to/qq-backup/Tencent Files/1987654321/nt_qq/nt_db/nt_msg.db"
source_header_bytes: 1024
db_key: ""
